<body>

    <h1>Time, Space, Complexity</h1>

    <p>
        Time complexity is used to measure how efficiently an algorithm runs as the input size increases.
    </p>

    <p>
        <b>Space Complexity</b> refers to the amount of memory an algorithm requires during execution. Some algorithms have a space complexity of <b>O(n)</b>.
    </p>
